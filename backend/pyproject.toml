[project]
name = "optiedt"
version = "1.0.0"
description = "Academic scheduling and optimization platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "ortools==9.15.6755",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "weasyprint>=63",
    "icalendar>=6.0",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "types-openpyxl>=3.1",
]

[project.scripts]
optiedt = "optiedt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiedt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "C4", "PT", "RET", "TID"]
ignore = [
    "S101",   # assert is the pytest idiom; production code does not rely on it
    "RUF012", # SQLAlchemy/Pydantic class attributes are not mutable defaults
    "N818",   # NotFound, Conflict… read better than NotFoundError at raise sites
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/optiedt/db/migrations/**" = ["E501"]
"src/optiedt/benchmarks/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["optiedt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*", "weasyprint.*", "icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "solver: exercises CP-SAT (slower)",
    "slow: long-running (benchmark-sized) tests",
]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
